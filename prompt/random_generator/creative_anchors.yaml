  cn: 镜面反转空间(倒影成为实体)
  tags: [mirror world, reflection becomes real, mirrored architecture, water-like sky]
  narrative: 地面是水面, 倒影里的城市才是真实的, 她行走在倒影之上
- id: frozen_time
  name: frozen moment
  cn: 时间停滞(凝固的瞬间)
  tags: [frozen time, suspended droplets, paused motion, floating dust still]
  narrative: 雨滴停在半空, 扬起的裙摆凝固, 只有她是画面中唯一在动的存在
- id: starry_sea
  name: starry underwater palace
  cn: 星空海底宫殿
