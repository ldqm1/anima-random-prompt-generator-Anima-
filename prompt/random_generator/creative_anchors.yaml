# 创意锚点池（Creative Anchors）
# 用途: 每次生成从本池随机抽取 1-2 个"高概念设定"注入提示词, 打破场景/动作/道具的默认组合趋同。
# 设计原则(对齐项目铁律):
#   1. 保留 youthful/唯美/可爱的少女向审美——锚点只是"设定层"的创意, 不改变角色与风格基调;
#   2. 不跨世界观混搭(对齐 Anima_prompt_template §4.1 风格一致性铁律)——锚点均为"同一世界观内的超现实/幻想元素";
#   3. 不含光影 tag(光影由 lora 内置, 光影意图只通过叙事句表达);
#   4. 二次元插画无需物理合理性, 锚点可大胆使用漂浮/巨大化/魔法/时间停滞等设定。
#
# 每个锚点字段:
#   id:        唯一标识
#   name:      英文核心 tag(必须出现在最终 prompt)
#   cn:        中文说明
#   tags:      配套 tag 组(3-5 个, 相互关联, 一起注入才构成完整设定)
#   narrative: 叙事句要点(机位/空间/设定逻辑, 供叙事句参考)

surreal_scene:            # 1. 超现实场景(同世界观内)
- id: inverted_city
  name: inverted city
  cn: 倒悬的城市(天空与大地颠倒)
  tags: [inverted city, gravity defying, floating debris, upside-down skyline]
  narrative: 整座城市倒悬在云海之上, 她从天台边缘探身, 发丝向上飘向星空
- id: floating_islands
  name: floating islands
  cn: 云海上的浮空岛群
  tags: [floating islands, sky archipelago, waterfalls from clouds, hanging gardens]
  narrative: 镜头仰视穿过浮岛间隙, 瀑布从云层边缘倾泻而下, 她在最上方的岛屿
- id: dream_layers
  name: dreamlike layered world
  cn: 梦境层叠的世界(现实与梦境交叠)
  tags: [dreamlike, layered world, translucent reality, floating fragments]
  narrative: 现实场景在边缘溶解成半透明的梦境碎片, 两层世界同时可见
- id: mirror_world
