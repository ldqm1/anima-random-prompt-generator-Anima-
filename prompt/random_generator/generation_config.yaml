  character: 40      # 角色相关：人数/性别、外貌、服装、表情、姿势/动作
  background: 40     # 背景相关：场景、环境、物件、光影、镜头/氛围
  other: 20          # 其他/缓冲

# r18 模式专用生成侧重点权重（百分比）
# 仅 max_rating 为 r18/r18g 时覆盖上方的 focus_weights，用于提示 LLM
# 在最终 prompt 中 r18 内容占 20%、背景压缩到 20%（不改变任何类别的抽样数量）。
# 非 r18 模式完全不受影响。
r18_focus_weights:
  character: 40      # 角色相关
  background: 20     # 背景相关（r18 模式下压缩）
  r18: 20            # r18 内容（成人主题 tag 占 20%）
  other: 20          # 其他/缓冲

# 多角色场景（如 2girls）触发时的自动调整
# 当抽样结果命中多角色标记（2girls / 3girls / 2boys / 3boys / multiple girls / multiple boys）时：
# - tag 数量限制：min_tags 与 max_tags 各增加 tag_count_bonus（n）
# - 生成侧重点：character 占比 + focus_character_bonus（m），
#   并从 background 与 other 中按比例扣减相同额度
multi_character:
  enabled: true             # 总开关：false 时人数/性别强制为 1girl，不生成双人/多人角色提示词
  probability: 0.25         # 多人角色占比（0-1）：每条样本按该概率掷骰，命中则 count_gender 为
                            # 2girls，否则为 1girl；0.5 = 与原来 1girl/2girls 均等随机等价
  tag_count_bonus: 30       # n，默认 20
  focus_character_bonus: 5 # m，默认 10（百分比）

# DeepSeek API 调用参数
# 如需覆盖环境变量或程序默认值，可取消注释并修改。
deepseek:
  temperature: 0.7
  max_tokens: 1000
  # 模型思考模式（reasoning_effort）：
  #   - "none" 关闭推理，输出更快、不占用 max_tokens、成本更低（推荐）
  #   - "low" / "medium" / "high" 开启推理（会占用 max_tokens，需相应调大）
  #   - 留空或省略表示不发送该参数，由平台默认决定
  # 注意：必须加引号，"none" 不带引号在 YAML 中会被解析为 null。
  reasoning_effort: "none"
  timeout: 120        # 单次 API 调用超时秒数；第三方代理较慢时可适当调大
  max_parse_retries: 2  # 解析失败（空内容/JSON 异常）时的最大重试次数

# 默认输出目录
# 当命令行未指定 --output 时，输出文件会放在该目录下。
output_dir: output

# 用户自定义额外要求，会原样注入到 LLM 用户提示词中。
# 可以是单条字符串或多行字符串。
# 当下方 extra_requirements_pool.enabled 为 true 时，优先使用池化配置，本字段作为兼容保留。
extra_requirements: |
  画面要体现出可爱的感觉。

# 额外要求池化配置。
# 启用后，每次生成会从 mutex_groups 与 optional_items 中动态抽样额外要求。
# 旧版 extra_requirements 字符串格式仍可用，仅在 enabled=true 时由池化配置接管。
# - mutex_groups：每组按 weight 加权抽 1 项；skip_probability 表示整组跳过（抽 0 项）的概率。
# - optional_items：每项按自身 probability 独立决定是否加入，与 weight 无关。
# - 条目级互斥：任意条目可通过可选字段 excludes（文本精确匹配列表）声明与其他条目互斥，
#   抽样时双向生效（已抽中任一侧都会排除另一侧）；互斥候选被过滤后，
#   若某组剩余候选为空则该组整组跳过，optional_items 冲突时直接不加入。
#   示例：A 组「极致的光影效果」excludes J 组「洒满金色阳光的黄昏」，两者不会同时出现。
extra_requirements_pool:
  enabled: true
  mutex_groups:
    # ---- A. 风格基调组（30% 跳过，软引导避免风格固化）----
    - skip_probability: 0.3
      items:
        - text: "画面要体现出可爱的感觉。"
          weight: 5
        - text: "画面要体现出唯美的感觉。"
          weight: 10
        - text: "画面要体现出极致的光影效果。"
          weight: 10
          excludes:
            - "背景是洒满金色阳光的黄昏。"
            - "背景中点缀着温暖的照明与挂饰。"
        - text: "画面要体现出元气活泼的感觉。"
          weight: 5
        - text: "画面要体现出静谧温柔的氛围。"
          weight: 8
        - text: "画面要体现出梦幻唯美的氛围。"
          weight: 6
        - text: "画面要体现出清新自然的氛围。"
          weight: 6
        - text: "画面要体现出安静内敛的文艺感。"
          weight: 5
        - text: "画面要体现出慵懒随性的生活感。"
          weight: 5
        - text: "画面要体现出热血燃动的张力感。"
          weight: 4
    # ---- B. 互动方向组（30% 跳过，软引导避免动作固化）----
    - skip_probability: 0.3
      items:
        - text: "角色要与背景或环境互动。"
          weight: 5
        - text: "角色要作出高难度动作。"
          weight: 5
          excludes:
            - "角色带着温和的倦意。"
            - "角色流露出淡淡的忧伤。"
        - text: "角色要与其他角色(如果tag中有其他角色)或摄像头互动。"
          weight: 15
        - text: "角色要做出自然的日常动作。"
          weight: 8
        - text: "角色要与镜头外的观者产生视线交流。"
          weight: 5
    # ---- C. 表情情绪组（60% 跳过，避免表情趋同）----
    - skip_probability: 0.6
      items:
        - text: "角色露出温柔的笑容。"
          weight: 6
        - text: "角色显得俏皮可爱。"
          weight: 6
        - text: "角色带着害羞的神情。"
          weight: 4
        - text: "角色神情专注而认真。"
          weight: 4
        - text: "角色带着一丝好奇。"
          weight: 3
        - text: "角色带着温和的倦意。"
          weight: 3
        - text: "角色露出自信从容的神情。"
          weight: 3
        - text: "角色流露出淡淡的忧伤。"
          weight: 2
        - text: "角色带着惊喜与雀跃的表情。"
          weight: 3
    # ---- D. 场景氛围倾向组（60% 跳过，软引导避免与抽样场景冲突）----
    - skip_probability: 0.6
      items:
        - text: "整体氛围偏向温馨的日常感。"
          weight: 6
          excludes:
            - "背景是细雨蒙蒙的雨天。"
            - "背景是白雪皑皑的冬日。"
        - text: "整体氛围偏向清新自然的室外感。"
          weight: 6
        - text: "整体氛围偏向青春洋溢的气息。"
          weight: 5
        - text: "整体氛围偏向繁华热闹的都市气息。"
          weight: 4
        - text: "整体氛围偏向安静恬淡的室内氛围。"
          weight: 3
        - text: "整体氛围偏向热闹喧嚣的街头感。"
          weight: 3
        - text: "整体氛围偏向开阔自然的旷野感。"
          weight: 4
        - text: "整体氛围偏向复古怀旧的陈设感。"
          weight: 3
    # ---- E. 镜头构图组（40% 跳过；多选项轮换避免构图趋同）----
    - skip_probability: 0.4
      items:
        - text: "采用半身构图，聚焦角色的神情。"
          weight: 6
        - text: "采用全身构图，突出角色的整体姿态。"
          weight: 5
        - text: "采用特写镜头，强调角色的面部细节。"
          weight: 4
          excludes:
            - "角色的穿着带有细节丰富的装饰点缀。"
            - "角色的穿搭凸显出鲜明的个人风格。"
        - text: "采用仰视视角，增强角色的气场。"
          weight: 3
        - text: "采用侧面视角，勾勒角色的轮廓线条。"
          weight: 3
        - text: "采用俯视视角，展现角色的身姿动态。"
          weight: 3
        - text: "采用远景构图，交代角色与环境的空间关系。"
          weight: 3
        - text: "采用三分法构图，主体置于画面三分之一处，留出环境呼吸空间。"
          weight: 3
        - text: "利用场景中的线条（道路、栏杆、光线）形成引导线，汇聚到角色身上。"
          weight: 3
        - text: "画面留白，利用大量负空间衬托角色的孤独或宁静。"
          weight: 3
        - text: "用前景物体（门框、树枝、雨幕、玻璃）做框架，将角色框在画面内。"
          weight: 3
        - text: "采用鸟瞰视角，从高处俯瞰角色与环境的关系。"
          weight: 2
        - text: "采用过肩镜头，透过前景角色的肩头看向主体。"
          weight: 2
        - text: "采用大特写，聚焦眼睛或手部的细节。"
          weight: 2
        - text: "采用对称构图，画面左右形成平衡。"
          weight: 2
        - text: "采用对角线构图，让角色的动势沿对角线展开。"
          weight: 2
        - text: "采用低角度仰拍，配合硬光与高对比，强化戏剧张力。"
          weight: 2
        - text: "主体位于画面边缘，朝向画面中心，形成张力。"
          weight: 2
    # ---- G. 服装穿搭组（60% 跳过，避免造型趋同）----
    - skip_probability: 0.6
      items:
        - text: "角色的穿着精致而考究。"
          weight: 6
        - text: "角色的穿着简约而日常。"
          weight: 8
        - text: "角色的服饰带有细腻的装饰纹样。"
          weight: 4
        - text: "角色的穿搭带有前卫的时尚感。"
          weight: 5
        - text: "角色的穿着带有清纯的校园气息。"
          weight: 6
        - text: "角色的穿着带有典雅的东方韵味。"
          weight: 5
        - text: "角色的穿着带有休闲的运动气息。"
          weight: 4
        - text: "角色的穿搭带有独特的个性风格。"
          weight: 4
        - text: "角色的穿着贴合当下场景的气质。"
          weight: 6
        - text: "角色的穿着带有细节丰富的装饰点缀。"
          weight: 4
        - text: "角色的穿搭凸显出鲜明的个人风格。"
          weight: 4
        - text: "角色的服饰材质带有独特的质感。"
          weight: 3
    # ---- H. 环境道具组（60% 跳过，避免场景趋同）----
    - skip_probability: 0.6
      items:
        - text: "背景中加入丰富的日常道具与摆件。"
          weight: 7
        - text: "背景中出现生机盎然的植物。"
          weight: 5
        - text: "背景中有散落的生活物件。"
          weight: 4
        - text: "背景中有精致或闪亮的装饰物。"
          weight: 3
        - text: "背景中有轻柔飘动的织物与窗景。"
          weight: 5
        - text: "背景中有错落有致的陈设与收藏。"
          weight: 4
        - text: "背景中点缀着温暖的照明与挂饰。"
          weight: 4
        - text: "背景中有朦胧的雾气与柔和的光晕。"
          weight: 3
        - text: "背景中的物件陈设与场景氛围相呼应。"
          weight: 4
        - text: "背景中出现错落有致的装饰元素。"
          weight: 4
        - text: "环境中的道具细节丰富耐看。"
          weight: 3
    # ---- J. 天气自然组（60% 跳过，避免场景趋同）----
    - skip_probability: 0.6
      items:
        - text: "背景是晴朗明媚的晴天。"
          weight: 6
        - text: "背景是细雨蒙蒙的雨天。"
          weight: 4
        - text: "背景是洒满金色阳光的黄昏。"
          weight: 5
        - text: "背景是白雪皑皑的冬日。"
          weight: 4
        - text: "背景是星光点点的夜晚。"
          weight: 5
        - text: "背景是晨雾弥漫的清晨。"
          weight: 4
        - text: "背景是彩虹浮现的雨后。"
          weight: 3
        - text: "背景是秋叶纷飞的季节。"
          weight: 4
  # ---- F. 可选特效（独立概率；不含光照类，避免与 A 组"极致光影"重复）----
  optional_items:
    - text: "加入随风飘落的樱花花瓣。"
      probability: 0.12
    - text: "加入轻柔飘动的发丝与裙摆动态。"
      probability: 0.2
    - text: "加入浅景深虚化的背景。"
      probability: 0.15
    - text: "加入细微的肢体动作细节。"
      probability: 0.15

# Excel 角色池配置
# 启用后，character_series 从解析后的 character_pool.json 中抽样，替代知识库 v1 的二次元角色。
# 需要先运行 python -m prompt.random_generator.tools.build_character_pool 生成缓存。
# 运行后会同步生成 IP 级索引文件 character_pool_series_index.json，可用于按作品开关角色池及男性角色过滤。
character_pool:
  enabled: true
  file: null              # null 表示使用默认路径 prompt/random_generator/character_pool.json
  prefer_same_ip_for_multiple: true  # 多角色场景下优先从同一作品抽样
  use_core_appearance: true           # 是否向 LLM 注入角色核心外貌词
  use_core_clothing_probability: 0.8  # 使用核心服饰词作为基础服饰的概率
  # IP 级索引文件路径：
  #   默认 prompt/random_generator/character_pool_series_index.json
  #   可手动编辑其中 enabled / allow_male 字段控制哪些作品参与抽样及是否允许男性角色
  series_index_file: null

# 白名单角色池（旧版）
# 当 enabled 为 true 且 pool 非空时，从 pool 中随机抽取角色 tag，替代知识库 v1 的二次元角色抽样。
# 当同时启用 character_pool 时，character_pool 优先级更高。
character_whitelist:
  enabled: false
  pool: []
  # pool 示例：
  # pool:
  #   - "hatsune miku"
  #   - "rem (re:zero)"
  #   - "fubuki (kancolle)"

# 通用类别白名单池
# 当 enabled 为 true 时，对于 pools 中指定的每个类别，优先从对应 pool 中抽样。
# 若某类别的 pool 为空或未指定，则保持原有知识库 v1 抽样逻辑。
# pools 的键名可以使用中文展示名（如下），也可以使用内部英文键名。
category_whitelists:
  enabled: false
  pools:
    人数与性别: []
    外貌: []
    服装与穿着状态: []
    姿势/动作/体位: []
    表情与反应: []
    镜头/景别/构图: []
    场景与环境: []
    画面质感/氛围: []
    二次元角色: []
