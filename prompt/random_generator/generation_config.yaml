#   enabled:          该主题是否参与（false = 主题下全部 tag 在主抽样与 r18 补充中都不出现）
#   mode:             出现模式：
#                      - fixed:         固定出现（非主题类推荐，如表情/裸露固定小数量）
#                      - probabilistic: 按 probability 概率出现（主题类推荐，如 bondage）
#                      - weighted:      始终可参与，仅按 weight 调节抽样权重（默认）
