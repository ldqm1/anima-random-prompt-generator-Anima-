#                      使主题集中出现；主抽样已出现的同类 tag 会扣除，避免超量）
#   probability:      probabilistic 模式的出现概率（0-1）
#   weight:           加权模式下的抽样权重（默认 1；weight 越大越容易被抽中）
#   linked_topics:    联动主题列表；本主题被激活（fixed/probabilistic 命中）时，
